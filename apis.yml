aid: poggio-labs
name: Poggio Labs
description: >-
  Poggio (Poggio Labs) is an AI revenue intelligence platform for enterprise
  sales teams — a "Revenue Superagent" that unlocks Salesforce investment by
  combining deep-research AI agents with a unified context engine connecting
  CRM, call recordings (Gong), documents, and real-time web intelligence to arm
  sellers with always-current account knowledge, prioritization, relationship
  maps, and automated account plans. Poggio exposes its intelligence
  programmatically through a versioned REST API (v2) and a hosted Model Context
  Protocol (MCP) server, both secured with OAuth 2.0 (authorization code, client
  credentials, refresh token) and dynamic client registration, plus native Slack,
  Salesforce/Agentforce, Highspot, and Gong integrations. Backed by Accel.
