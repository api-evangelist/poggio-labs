apis:
- name: Poggio REST API v2
  description: >-
    Versioned REST API (v2) exposing Poggio account intelligence, context search, account digests, the
    superagent chat, Salesforce account-plan writeback, and third-party integration registration. Secured
    with OAuth 2.0 (authorization code, client credentials, refresh token) and dynamic client registration;
    organization is inferred from the access token.
  humanURL: https://poggio.io/docs/api
  baseURL: https://api.poggio.io/v2
  tags:
  - Account Intelligence
  - Salesforce
  - Context
  - SuperAgent
  tags_raw:
  - Account Intelligence
  - Salesforce
  - Context
  - Superagent
  properties:
  - type: APIReference
    url: https://poggio.io/docs/api/v2
  - type: Documentation
    url: https://poggio.io/docs/api
- name: Poggio MCP Server
  description: >-
    Hosted, remote Model Context Protocol server exposing Poggio account intelligence to AI clients —
    search and fetch account intelligence documents, create or recreate accounts, and query the Poggio
    assistant across web search, Salesforce and Gong. Authenticated with OAuth 2.0 including Dynamic Client
    Registration; tools/list is auth-gated (HTTP 401 anonymously, probed 2026-08-13).
  humanURL: https://poggio.io/docs/mcp
  baseURL: https://mcp.poggio.io/mcp
  tags:
  - MCP
  - AI Agents
  - Account Intelligence
  properties:
  - type: MCPServer
    url: mcp/poggio-labs-mcp.yml
  - type: Documentation
    url: https://poggio.io/docs/mcp
  - type: APIReference
    url: https://poggio.io/docs/mcp/tool-specs
- name: Goalkeeper MCP Server
  description: >-
    Stateless Streamable HTTP MCP service shipped with Goalkeeper, exposing 11 tools for creating and
    reading goals, appending status/health/evaluation reports, and managing labels. Supports MCP protocol
    2026-07-28 with a 2025-11-25 stateless fallback, authenticates with a scoped Goalkeeper API token
    or an injected OAuth provider (RFC 9728 protected-resource metadata, PKCE, CIMD or DCR). Distributed
    as a container image — Poggio Labs operates no hosted endpoint.
  humanURL: https://docs.gkeeper.ai/docs/concepts/mcp
  baseURL: http://127.0.0.1:3002/mcp
  x-baseurl-note: >-
    The documented local address for the self-hosted service. There is no vendor-hosted Goalkeeper MCP
    endpoint; a deployment sets its own PUBLIC_MCP_URL.
  tags:
  - MCP
  - AI Agents
  - Goals
  - Open-Source
  tags_raw:
