lifecycle_notes:
- >-
  Goals are archived through a status report (report_goal_update / createGoalUpdate), not
  deleted, on the MCP surface; REST additionally exposes deleteGoal.
- >-
  Goal writes are revision-checked: a caller supplies expectedRevision and the update is
  applied atomically or rejected with 409.
- >-
  A label can only be deleted when it is unassigned.
poggio_platform_note: >-
